patch:
- file: pybte/__init__.py
  find: "A fidelity port of the Fortran research solver in ``fortran-reference/``,\noffering the same two iteration schemes:\n\
    \n``accflag = 0``  CIS  -- conventional source iteration\n``accflag = 1``  GSIS -- general synthetic iterative scheme\
    \ (HDG macroscopic\n                 acceleration)\n\nTypical use::\n\n    from pybte import Case, Solver\n\n    case\
    \ = Case.from_yaml(\"cases/cavity_tauR1e-3_gsis.yaml\")"
  replace: "Typical use::\n\n    from pybte import Case, Solver\n\n    case = Case.from_yaml(\"cases/kn_1e-2.yaml\")"
  count: 1
- file: pybte/__init__.py
  find: "                     Performance, Restart, Scheme, VelMesh,\n                     case_from_control_in, parse_control_in)"
  replace: '                     Performance, Restart, Scheme, VelMesh)'
  count: 1
- file: pybte/__init__.py
  find: '           "Performance", "case_from_control_in", "parse_control_in"]'
  replace: '           "Performance"]'
  count: 1
- file: pybte/_numba.py
  find: '"""Optional numba acceleration.'
  replace: '"""Optional numba compilation.'
  count: 1
- file: pybte/config.py
  find: "* ``scheme.acc_variant``   -- A (``Synthetic_Acceleration.f90``, the default)\n                              or B\
    \ (``Synthetic_Acceleration1.f90``)\n* ``scheme.stabilisation`` -- the HDG ``ST(1:3)``\n"
  replace: ''
  count: 1
- file: pybte/config.py
  find: "    accflag: int = 0                     # 0 = CIS, 1 = GSIS\n    acc_variant: str = \"A\"\n    stabilisation: list\
    \ = field(default_factory=lambda: [1.0, 1.0, 1.0])\n    #: divide ST(2:3) by the global minimum element height\n    scale_by_hmin:\
    \ bool = False\n    #: 'raise' or 'break' when a direction's sweep graph has a cycle\n    on_cycle: str = \"raise\""
  replace: "    #: 'raise' or 'break' when a direction's sweep graph has a cycle\n    on_cycle: str = \"raise\""
  count: 1
- file: pybte/config.py
  find: "        self.accflag = int(self.accflag)\n        self.acc_variant = str(self.acc_variant).upper()\n        self.stabilisation\
    \ = [float(v) for v in self.stabilisation]\n        self.scale_by_hmin = bool(self.scale_by_hmin)"
  replace: ''
  count: 1
- file: pybte/config.py
  find: "        if self.scheme.acc_variant not in (\"A\", \"B\"):\n            raise ValueError(\"scheme.acc_variant must\
    \ be 'A' or 'B'\")\n        if len(self.scheme.stabilisation) != 3:\n            raise ValueError(\"scheme.stabilisation\
    \ must have three entries\")\n"
  replace: ''
  count: 1
- file: pybte/config.py
  find: '    tau_thr: float = 1.0

    '
  replace: ''
  count: 1
- file: pybte/config.py
  find: '        self.tau_thr = float(self.tau_thr)

    '
  replace: ''
  count: 1
- file: pybte/driver.py
  find: "        IF CIS  : Calculate_Macro_Properties\n        IF GSIS : HoT source; global trace solve; local recovery; correction\n"
  replace: '        Calculate_Macro_Properties

    '
  count: 1
- file: pybte/driver.py
  find: "        self.acc = None\n        if c.scheme.accflag == 1:\n            from .acceleration import Acceleration\n\
    \            self.acc = Acceleration(self)\n\n"
  replace: ''
  count: 1
- file: pybte/driver.py
  find: "        if self.acc is None:\n            compute_moments(self.vdf, self.ctx.cxv, self.ctx.cyv, self.ctx.domega,\n\
    \                            self.integrals.int_tri, self.case.flow.cv, self.mom)\n        else:\n            self.acc.apply()"
  replace: "        compute_moments(self.vdf, self.ctx.cxv, self.ctx.cyv, self.ctx.domega,\n                        self.integrals.int_tri,\
    \ self.case.flow.cv, self.mom)"
  count: 1
- file: pybte/driver.py
  find: "            if res < tol:\n                # With a frozen defect (scheme.defect_every = 0) reaching the\n      \
