[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybte"
version = "1.0.0"
description = "Gray Callaway PBTE numerical backend for accelerated-iteration exploration: DG, discrete ordinates, CIS, GSIS and Krylov"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "StiKine-Bench"}]
keywords = ["phonon", "Boltzmann", "discontinuous Galerkin", "discrete ordinates",
            "GSIS", "synthetic acceleration", "heat conduction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
test = ["pytest>=7.0"]
dev = ["numba>=0.58", "pytest>=7.0"]

[project.scripts]
pybte = "pybte.__main__:main"

[project.urls]
Source = "https://github.com/dingtao-shen/AI-Driven-Numerical-Method-Exploration-for-Multiscale-PBTE"

[tool.setuptools.packages.find]
include = ["pybte*"]

[tool.setuptools.package-data]
pybte = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running integration runs",
]
filterwarnings = ["ignore::DeprecationWarning"]
