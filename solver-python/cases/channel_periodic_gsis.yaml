# Cross-plane conduction: periodic in x, thermalising walls in y.
# Exercises the periodic branch of the BC dispatch, which is dead code
# in the Fortran.  The converged field must be independent of x, and in the
# diffusive limit T -> y.
iteration:  {tol: 1.0e-8, tmax: 200000}
scheme:     {accflag: 1}
velmesh:    {npole: 20, nazim: 40}
dg:         {deg: 3}
flow:       {cv: 1.0, vg: 1.0, tau_r: 1.0e-2, tau_n: 1.0e+5, tau_thr: 1.0}
mesh:       {file: ../meshes/C1_Nx11_Ny11.msh}
boundaries:
  - {name: Swall,  phyid: 11, type: thermalising, temp: 0.0}
  - {name: NWall,  phyid: 12, type: thermalising, temp: 1.0}
  - {name: Master, phyid: 13, type: periodic, temp: 0.0, xoff: -1.0}
  - {name: Slave,  phyid: 14, type: periodic, temp: 0.0, xoff:  1.0}
restart:    {enabled: false}
output:     {dir: ../out/channel_periodic_gsis, field: true}
